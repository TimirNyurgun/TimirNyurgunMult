<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Интерактив | Тимир уонна Ньургун</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat Alternates', sans-serif;
            background-image: url('img/background.png');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 140px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .header {
            background: transparent;
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .menu-wrapper {
            background: white;
            border-radius: 60px;
            border: 2px solid #6bb5e8;
            padding: 10px 25px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .nav-left {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-left: 40px;
        }

        .nav-right {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
        }

        .nav-left a, .nav-right a {
            color: #2c6e9e;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 6px 14px;
            border-radius: 40px;
            transition: 0.2s;
            white-space: nowrap;
        }

        .nav-left a:hover, .nav-right a:hover {
            background: rgba(44, 110, 158, 0.1);
        }

        .lang-wrapper {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 15px;
            z-index: 100;
        }

        .lang-btn-header {
            background: rgba(44, 110, 158, 0.15);
            border: 1.5px solid #2c6e9e;
            color: #2c6e9e;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .lang-btn-header:hover {
            background: rgba(44, 110, 158, 0.3);
            transform: scale(1.02);
        }

        .sun-block {
            position: absolute;
            top: 95%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sun-icon {
            width: 300px;
            height: 250px;
            object-fit: contain;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            position: relative;
        }

        .sun-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        .sun-text .line1, .sun-text .line2 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #2c6e9e;
            display: block;
            margin-bottom: 2px;
        }

        .page-title {
            text-align: center;
            font-size: 2.5rem;
            color: #2c6e9e;
            margin: 100px 0 40px;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
            font-weight: 700;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .game-card {
            background-image: url('img/облако.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 50px 20px;
            border-radius: 60px;
            text-align: center;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            border: none;
            min-height: 350px;
            justify-content: center;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
        }

        .game-card .fa-paintbrush {
            font-size: 4.5rem;
            color: #FFB347;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
            margin-bottom: 10px;
        }

        .game-card h3 {
            font-size: 2rem;
            color: #2c6e9e;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .game-card p {
            font-size: 1rem;
            color: #2c6e9e;
            opacity: 0.8;
            max-width: 250px;
        }

        footer {
            background: rgba(30, 60, 90, 0.8);
            text-align: center;
            padding: 20px;
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        @media (max-width: 900px) {
            body { padding-top: 180px; }
            .menu-wrapper { padding: 10px 15px; }
            .header-row { flex-direction: column; gap: 10px; }
            .nav-left, .nav-right { justify-content: center; margin-left: 0; }
            .lang-wrapper {
                position: static;
                margin-top: 15px;
                text-align: center;
            }
            .sun-block {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                margin: 10px auto 0;
            }
            .sun-icon { width: 200px; height: 170px; }
            .page-title { font-size: 1.8rem; margin-top: 140px; }
            .games-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 25px;
            }
            .game-card { padding: 35px 15px; min-height: 300px; }
            .game-card .fa-paintbrush { font-size: 3.5rem; }
            .game-card h3 { font-size: 1.6rem; }
            .game-card p { font-size: 0.9rem; }
        }

        @media (max-width: 650px) {
            body { padding-top: 220px; }
            .page-title { margin-top: 160px; font-size: 1.5rem; }
            .games-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            .game-card { max-width: 350px; margin: 0 auto; width: 100%; }
            .sun-icon { width: 150px; height: 130px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="menu-wrapper">
            <div class="header-row">
                <div class="nav-left">
                    <a href="index.html" id="navHome">Главная</a>
                    <a href="index.html#about-multik" id="navAbout">О мультсериале</a>
                    <a href="index.html#characters-slider" id="navCharacters">Персонажи</a>
                </div>
                <div class="nav-right">
                    <a href="mypage.html" id="navInteractive">Интерактив</a>
                    <a href="watch.html" id="navWatch">Смотреть</a>
                    <a href="index.html#contact" id="navContacts">Контакты</a>
                    <div class="lang-wrapper">
                        <button class="lang-btn-header" id="langToggle">🇷🇺 Якутский</button>
                    </div>
                </div>
            </div>
            <div class="sun-block">
                <img src="img/sun.png" alt="Солнце" class="sun-icon">
                <div class="sun-text">
                    <span class="line1" id="sunLine1">Тимир уонна</span>
                    <span class="line2" id="sunLine2">Ньургун</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main style="flex: 1;">
    <div class="container">
        <h1 class="page-title" id="pageTitle">🎮 Интерактив</h1>
        <div class="games-grid">
            <a href="coloring.html" class="game-card">
                <i class="fas fa-paintbrush"></i>
                <h3 id="gameTitle1">🎨 Раскраска</h3>
                <p id="gameDesc1">Раскрась любимых персонажей</p>
            </a>
            <a href="tictactoe.html" class="game-card">
                <h3 id="gameTitle2">❌ Крестики-нолики ⭕</h3>
                <p id="gameDesc2">Сыграй с компьютером</p>
            </a>
            <a href="test.html" class="game-card">
                <h3 id="gameTitle3">📝 Тест</h3>
                <p id="gameDesc3">Проверь свои знания о мультсериале</p>
            </a>
        </div>
    </div>
</main>

<footer>
    <p id="footerText">© 2026 «Тимир уонна Ньургун» | Играй, рисуй и познавай!</p>
</footer>

<script>
    const translations = {
        ru: {
            navHome: "Главная", navAbout: "О мультсериале", navCharacters: "Персонажи",
            navInteractive: "Интерактив", navWatch: "Смотреть", navContacts: "Контакты",
            sunLine1: "Тимир уонна", sunLine2: "Ньургун",
            pageTitle: "🎮 Интерактив",
            gameTitle1: "🎨 Раскраска", gameDesc1: "Раскрась любимых персонажей",
            gameTitle2: "❌ Крестики-нолики ⭕", gameDesc2: "Сыграй с компьютером",
            gameTitle3: "📝 Тест", gameDesc3: "Проверь свои знания о мультсериале",
            footerText: "© 2026 «Тимир уонна Ньургун» | Играй, рисуй и познавай!",
            langBtn: "🇸🇦 Саха тыла"
        },
        sah: {
            navHome: "Сүрүн сирэй", navAbout: "Ойуулук туһунан", navCharacters: "Дьоруойдар",
            navInteractive: "Оонньуулар", navWatch: "Көрүөххэ", navContacts: "Билсэр ситим",
            sunLine1: "Тимир уонна", sunLine2: "Ньургун",
            pageTitle: "🎮 Тимири уонна Ньургуну кытта оонньоо",
            gameTitle1: "🎨 Кырааскалааһын", gameDesc1: "Кырааскалаа тапталлаах дьоруойдары",
            gameTitle2: "❌ Кириэстник-нолик ⭕", gameDesc2: "Компьютеры кытта оонньоо",
            gameTitle3: "📝 Тургутук", gameDesc3: "Билиилэрин тургутуу мультсериал туһунан",
            footerText: "© 2026 «Тимир уонна Ньургун» | Оонньоо, кырааскалаа уонна бил!",
            langBtn: "🇷🇺 Нууччалыы"
        }
    };

    let currentLang = localStorage.getItem('appLanguage') || 'ru';

    function updateLanguage() {
        const t = translations[currentLang];
        document.getElementById('navHome').textContent = t.navHome;
        document.getElementById('navAbout').textContent = t.navAbout;
        document.getElementById('navCharacters').textContent = t.navCharacters;
        document.getElementById('navInteractive').textContent = t.navInteractive;
        document.getElementById('navWatch').textContent = t.navWatch;
        document.getElementById('navContacts').textContent = t.navContacts;
        document.getElementById('sunLine1').textContent = t.sunLine1;
        document.getElementById('sunLine2').textContent = t.sunLine2;
        document.getElementById('pageTitle').innerHTML = t.pageTitle;
        document.getElementById('gameTitle1').innerHTML = t.gameTitle1;
        document.getElementById('gameDesc1').textContent = t.gameDesc1;
        document.getElementById('gameTitle2').innerHTML = t.gameTitle2;
        document.getElementById('gameDesc2').textContent = t.gameDesc2;
        document.getElementById('gameTitle3').innerHTML = t.gameTitle3;
        document.getElementById('gameDesc3').textContent = t.gameDesc3;
        document.getElementById('footerText').textContent = t.footerText;
        document.getElementById('langToggle').innerHTML = t.langBtn;
    }

    document.getElementById('langToggle').addEventListener('click', () => {
        currentLang = currentLang === 'ru' ? 'sah' : 'ru';
        localStorage.setItem('appLanguage', currentLang);
        updateLanguage();
    });

    updateLanguage();
</script>
</body>
</html>
