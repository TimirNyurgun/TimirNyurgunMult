<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Смотреть | Тимир уонна Ньургун</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Тот же стиль что и в index.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            background-image: url('img/background.png');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            padding-top: 140px;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 10; }
        .header { background: transparent; padding: 15px 0; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; }
        .menu-wrapper { background: white; border-radius: 60px; border: 2px solid #6bb5e8; padding: 10px 25px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .nav-left { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-left: 40px; }
        .nav-right { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; position: relative; }
        .nav-left a, .nav-right a { color: #2c6e9e; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 6px 14px; border-radius: 40px; transition: 0.2s; white-space: nowrap; }
        .nav-left a:hover, .nav-right a:hover { background: rgba(44, 110, 158, 0.1); }
        .lang-wrapper { position: absolute; top: 100%; right: 0; margin-top: 15px; z-index: 100; }
        .lang-btn-header { background: rgba(44, 110, 158, 0.15); border: 1.5px solid #2c6e9e; color: #2c6e9e; padding: 6px 14px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; font-family: inherit; white-space: nowrap; }
        .lang-btn-header:hover { background: rgba(44, 110, 158, 0.3); transform: scale(1.02); }
        .sun-block { position: absolute; top: 95%; left: 50%; transform: translate(-50%, -50%); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sun-icon { width: 300px; height: 250px; object-fit: contain; transition: transform 0.3s ease; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); position: relative; }
        .sun-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; pointer-events: none; }
        .sun-text .line1, .sun-text .line2 { font-size: 0.9rem; font-weight: 700; color: #2c6e9e; display: block; margin-bottom: 2px; }
        .main-content { flex: 1; }
        .content { padding: 40px 0; }
        .video-section { background: rgba(0, 0, 0, 0.3); border-radius: 40px; padding: 20px; margin-bottom: 40px; }
        .video-title { font-size: 1.8rem; margin-bottom: 20px; text-align: center; color: #2c6e9e; font-weight: 600; }
        .video-wrapper { position: relative; width: 100%; border-radius: 30px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.3); background: #000; }
        .video-wrapper video { width: 100%; height: auto; display: block; }
        .episodes-list { background: rgba(255, 255, 255, 0.15); border-radius: 40px; padding: 30px; border: 1px solid rgba(255,255,255,0.3); }
        .episodes-list h3 { font-size: 1.8rem; margin-bottom: 20px; text-align: center; color: #2c6e9e; font-weight: 600; }
        .episodes-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .episode-btn { background: rgba(44, 110, 158, 0.2); border: 2px solid #2c6e9e; padding: 12px 30px; font-size: 1.2rem; font-weight: 600; border-radius: 60px; color: #2c6e9e; cursor: pointer; transition: 0.2s; font-family: 'Montserrat Alternates', sans-serif; display: flex; align-items: center; gap: 10px; }
        .episode-btn:hover { background: rgba(44, 110, 158, 0.4); transform: scale(1.02); }
        .episode-btn.active { background: #FFB347; border-color: #ffffff; color: #1e3b4f; }
        footer { background: rgba(30, 60, 90, 0.8); text-align: center; padding: 20px; border-top: 1px solid rgba(255,255,255,0.2); margin-top: auto; }
        @media (max-width: 1100px) { body { padding-top: 120px; } .sun-icon { width: 75px; height: 75px; } .sun-text .line1, .sun-text .line2 { font-size: 0.7rem; } .nav-left a, .nav-right a { padding: 5px 10px; font-size: 0.8rem; } .nav-left, .nav-right { gap: 10px; } .menu-wrapper { padding: 10px 20px; } .video-title { font-size: 1.4rem; } .episodes-list h3 { font-size: 1.4rem; } .episode-btn { padding: 8px 20px; font-size: 1rem; } }
        @media (max-width: 900px) { body { padding-top: 180px; } .menu-wrapper { padding: 15px 20px; } .header-row { flex-direction: column; gap: 12px; } .nav-left, .nav-right { justify-content: center; margin-left: 0; } .lang-wrapper { position: static; margin-top: 15px; text-align: center; } .sun-block { position: relative; top: auto; left: auto; transform: none; margin: 10px auto; display: flex; justify-content: center; } .sun-icon { width: 200px; height: 170px; } .video-title { font-size: 1.2rem; } .episodes-list h3 { font-size: 1.2rem; } .episode-btn { padding: 6px 15px; font-size: 0.85rem; } }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="menu-wrapper">
            <div class="header-row">
                <div class="nav-left">
                    <a href="index.html" id="navHome">Главная</a>
                    <a href="index.html#about-multik" id="navAbout">О мультсериале</a>
                    <a href="index.html#characters-slider" id="navCharacters">Персонажи</a>
                </div>
                <div class="nav-right">
                    <a href="mypage.html" id="navInteractive">Интерактив</a>
                    <a href="watch.html" id="navWatch">Смотреть</a>
                    <a href="index.html#contact" id="navContacts">Контакты</a>
                    <div class="lang-wrapper">
                        <button class="lang-btn-header" id="langToggle">🇷🇺 Якутский</button>
                    </div>
                </div>
            </div>
            <div class="sun-block">
                <img src="img/sun.png" alt="Солнце" class="sun-icon">
                <div class="sun-text">
                    <span class="line1" id="sunLine1">Тимир уонна</span>
                    <span class="line2" id="sunLine2">Ньургун</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="container content">
        <div class="video-section">
            <h2 class="video-title" id="currentVideoTitle">📺 1 серия - Знакомство</h2>
            <div class="video-wrapper">
                <video id="mainVideo" controls controlsList="nodownload" poster="img/poster.png">
                    <source src="video/1серия.mp4" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            </div>
            <p style="text-align: center; font-size: 0.8rem; margin-top: 10px; opacity: 0.7; color: #2c6e9e;">💡 Нажмите на кнопку воспроизведения</p>
        </div>

        <div class="episodes-list">
            <h3><i class="fas fa-list"></i> <span id="episodesTitle">Список серий</span></h3>
            <div class="episodes-grid">
                <button class="episode-btn active" data-video="video/1серия.mp4" data-title-ru="🎬 1 серия - Знакомство" data-title-sah="🎬 1 сиэрийэ - Билcиһии">
                    <i class="fas fa-play"></i> <span class="episode-text">1 серия</span>
                </button>
                <button class="episode-btn" data-video="video/2серия.mp4" data-title-ru="🎬 2 серия - Тайна озера" data-title-sah="🎬 2 сиэрийэ - Күөл таайана">
                    <i class="fas fa-play"></i> <span class="episode-text">2 серия</span>
                </button>
                <button class="episode-btn" data-video="video/3серия.mp4" data-title-ru="🎬 3 серия - Северное сияние" data-title-sah="🎬 3 сиэрийэ - Хотугу сырдык">
                    <i class="fas fa-play"></i> <span class="episode-text">3 серия</span>
                </button>
                <button class="episode-btn" data-video="video/4серия.mp4" data-title-ru="🎬 4 серия - Новый друг" data-title-sah="🎬 4 сиэрийэ - Саҥа доҕор">
                    <i class="fas fa-play"></i> <span class="episode-text">4 серия</span>
                </button>
                <button class="episode-btn" data-video="video/5серия.mp4" data-title-ru="🎬 5 серия - Песня Ньургуна" data-title-sah="🎬 5 сиэрийэ - Ньургун ырыата">
                    <i class="fas fa-music"></i> <span class="episode-text">5 серия</span>
                </button>
            </div>
        </div>
    </div>
</main>

<footer>
    <p id="footerText">© 2026 «Тимир уонна Ньургун» | Все серии доступны на якутском и русском языках</p>
</footer>

<script>
    const translations = {
        ru: {
            navHome: "Главная", navAbout: "О мультсериале", navCharacters: "Персонажи",
            navInteractive: "Интерактив", navWatch: "Смотреть", navContacts: "Контакты",
            sunLine1: "Тимир уонна", sunLine2: "Ньургун",
            episodesTitle: "Список серий",
            footerText: "© 2026 «Тимир уонна Ньургун» | Все серии доступны на якутском и русском языках",
            langBtn: "🇸🇦 Саха тыла",
            episodeTexts: ["1 серия", "2 серия", "3 серия", "4 серия", "5 серия"]
        },
        sah: {
            navHome: "Сүрүн сирэй", navAbout: "Ойуулук туһунан", navCharacters: "Дьоруойдар",
            navInteractive: "Оонньуулар", navWatch: "Көрүөххэ", navContacts: "Билсэр ситим",
            sunLine1: "Тимир уонна", sunLine2: "Ньургун",
            episodesTitle: "Сиэрийэлэр тиһиктэрэ",
            footerText: "© 2026 «Тимир уонна Ньургун» | Сиэрийэлэр бары сахалыы уонна нууччалыы тылларга бааллар",
            langBtn: "🇷🇺 Нууччалыы",
            episodeTexts: ["1 сиэрийэ", "2 сиэрийэ", "3 сиэрийэ", "4 сиэрийэ", "5 сиэрийэ"]
        }
    };

    let currentLang = localStorage.getItem('appLanguage') || 'ru';

    function updateLanguage() {
        const t = translations[currentLang];
        document.getElementById('navHome').textContent = t.navHome;
        document.getElementById('navAbout').textContent = t.navAbout;
        document.getElementById('navCharacters').textContent = t.navCharacters;
        document.getElementById('navInteractive').textContent = t.navInteractive;
        document.getElementById('navWatch').textContent = t.navWatch;
        document.getElementById('navContacts').textContent = t.navContacts;
        document.getElementById('sunLine1').textContent = t.sunLine1;
        document.getElementById('sunLine2').textContent = t.sunLine2;
        document.getElementById('episodesTitle').textContent = t.episodesTitle;
        document.getElementById('footerText').textContent = t.footerText;
        document.getElementById('langToggle').innerHTML = t.langBtn;
        
        const episodeTexts = document.querySelectorAll('.episode-text');
        episodeTexts.forEach((el, idx) => { if (t.episodeTexts[idx]) el.textContent = t.episodeTexts[idx]; });
        
        const activeBtn = document.querySelector('.episode-btn.active');
        if (activeBtn) {
            const videoTitle = document.getElementById('currentVideoTitle');
            const title = currentLang === 'ru' ? activeBtn.dataset.titleRu : activeBtn.dataset.titleSah;
            if (title) videoTitle.textContent = title;
        }
    }

    document.getElementById('langToggle').addEventListener('click', () => {
        currentLang = currentLang === 'ru' ? 'sah' : 'ru';
        localStorage.setItem('appLanguage', currentLang);
        updateLanguage();
    });

    updateLanguage();

    const videoElement = document.getElementById('mainVideo');
    const videoTitle = document.getElementById('currentVideoTitle');
    const episodeBtns = document.querySelectorAll('.episode-btn');
    
    episodeBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const videoSrc = this.getAttribute('data-video');
            const title = currentLang === 'ru' ? this.getAttribute('data-title-ru') : this.getAttribute('data-title-sah');
            videoElement.querySelector('source').src = videoSrc;
            videoElement.load();
            videoTitle.textContent = title;
            episodeBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>
</body>
</html>
